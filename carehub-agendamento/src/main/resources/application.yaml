# Perfil padrao: Postgres do docker-compose. Sem Docker, use o perfil dev:
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
server:
  port: 8081

spring:
  application:
    name: carehub-agendamento

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://localhost:5432/carehub_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # So este servico roda migrations no schema
  flyway:
    enabled: true
    locations: classpath:db/migration

carehub:
  rabbitmq:
    exchange: carehub.consultas.exchange
    routing-key: consulta.evento
    queue: carehub.notificacoes.queue
    dlx: carehub.consultas.dlx
    dlq: carehub.notificacoes.dlq
    dlq-routing-key: consulta.notificacao.dlq
