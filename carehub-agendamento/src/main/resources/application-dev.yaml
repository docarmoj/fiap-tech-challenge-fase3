# Perfil dev: H2 em memoria em modo PostgreSQL, roda as mesmas migrations.
# Console: http://localhost:8081/h2-console (usuario sa, senha vazia)
spring:
  datasource:
    url: jdbc:h2:mem:carehubdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
