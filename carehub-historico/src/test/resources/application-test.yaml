# Perfil de teste: H2 em modo PostgreSQL, rodando as migrations do Flyway.
# O RabbitMQ fica de fora: com ele ligado, a suite consumiria mensagens da fila de verdade.
spring:
  autoconfigure:
    exclude: org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  datasource:
    url: jdbc:h2:mem:carehub_historico_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
