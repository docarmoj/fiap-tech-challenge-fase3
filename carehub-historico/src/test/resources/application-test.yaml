# Perfil de teste: H2 em modo PostgreSQL, roda as migrations reais do Flyway.
# Nenhum broker sobe na suite: o listener e exercitado chamando o metodo diretamente.
spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  datasource:
    url: jdbc:h2:mem:carehub_historico_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
