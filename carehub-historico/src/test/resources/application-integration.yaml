spring:
  datasource:
    url: jdbc:h2:mem:carehub_historico_integration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

carehub:
  rabbitmq:
    consumer:
      exchange: carehub.consultas.exchange
      routing-key: consulta.evento
      queue: carehub.historico.queue
      dlx: carehub.consultas.dlx
      dlq: carehub.historico.dlq
      dlq-routing-key: consulta.historico.dlq
